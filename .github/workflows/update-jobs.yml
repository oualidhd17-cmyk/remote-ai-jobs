name: Update Jobs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go scraper
        run: |
          cd scraper-go
          go mod tidy
          go run main.go

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python pipeline
        run: |
          python pipeline-python/run_pipeline.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync generated data to frontend
        run: |
          node scripts/sync-data.mjs

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Commit updated data
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@example.com"
          git add scraper-go/output pipeline-python/output frontend/public
          git commit -m "Update jobs data" || echo "No changes to commit"
          git push